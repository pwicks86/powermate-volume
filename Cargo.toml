[package]
name = "powermate-volume"
version = "0.1.0"
edition = "2024"

[dependencies]
nusb = { version = "0.2.3", features=["smol"]}
futures-lite = "2.6.1"
anyhow = "1.0.102"
hidapi = "2.6.5"
windows = { version = "0.62.2", features = [
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Variant",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }
log = "0.4.29"
env_logger = "0.11.10"
